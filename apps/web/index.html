    <script>
      // The theme before the first paint: ?dark / ?theme=, then the saved choice, then the system.
      try {
        var q = new URLSearchParams(location.search),
          s = localStorage.getItem('crew-theme')
        var dark = q.has('dark') || q.get('theme') === 'dark'
        var light = q.has('light') || q.get('theme') === 'light'
        if (dark || (!light && (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
